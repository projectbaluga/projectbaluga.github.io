<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <image id="sheet" href="data:image/webp;base64," x="0" y="0" width="288" height="192" preserveAspectRatio="none"/>
  </defs>
  <symbol id="idle" viewBox="0 0 96 96" overflow="hidden">
    <use href="#sheet" x="0" y="0"/>
  </symbol>
  <symbol id="thinking" viewBox="0 0 96 96" overflow="hidden">
    <use href="#sheet" x="-96" y="0"/>
  </symbol>
  <symbol id="responding" viewBox="0 0 96 96" overflow="hidden">
    <use href="#sheet" x="-192" y="0"/>
  </symbol>
  <symbol id="success" viewBox="0 0 96 96" overflow="hidden">
    <use href="#sheet" x="0" y="-96"/>
  </symbol>
  <symbol id="error" viewBox="0 0 96 96" overflow="hidden">
    <use href="#sheet" x="-96" y="-96"/>
  </symbol>
  <symbol id="offline" viewBox="0 0 96 96" overflow="hidden">
    <use href="#sheet" x="-192" y="-96"/>
  </symbol>
</svg>